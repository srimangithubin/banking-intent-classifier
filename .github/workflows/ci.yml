
name: BANKING77 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Verify GitHub runner
        uses: actions/checkout@v7

      - name: setup python 
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      
      - name: Verify environment
        run: |
          python --version
          ls -la
          echo "BANKING77 runner is ready"
      - name: Install project dependencies
        run: |
          python -m pip install . pytest httpx2 ruff
          python -m pip check

      - name: Test BANKING77 FastAPI
        env:
          BANKING77_MODEL_PATH: ${{ github.workspace }}/artifacts/models/banking_intent_classifier_model.joblib
        run: |
          python -c "import banking_intent_classifier.models.predict as p; print('Imported from:', p.__file__); print('Model:', p.MODEL_PATH); print('Exists:', p.MODEL_PATH.is_file())"
          python -m pytest tests/integration/test_api.py -v
      
      - name: Check Pyhtoon code with Ruff
        run: python -m ruff check src tests

      - name: Build Docker image
        run: docker build -t banking77_api:ci . 