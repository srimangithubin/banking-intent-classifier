
name: BANKING77 CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Verify GitHub runner
        uses: actions/checkout@v7

      - name: setup python 
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      
      - name: Verify environment
        run: |
          python --version
          ls -la
          echo "BANKING77 runner is ready"
