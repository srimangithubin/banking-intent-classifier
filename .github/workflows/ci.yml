
name: BANKING77 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Step 3: Verify runner environment
      - name: Verify environment
        run: |
          python --version
          ls -la
          echo "BANKING77 runner is ready"

      # Step 4: Install dependencies
      - name: Install project dependencies
        run: |
          python -m pip install . pytest httpx2 ruff
          python -m pip check

      # Step 5: Run all automated tests
      - name: Test BANKING77
        env:
          BANKING77_MODEL_PATH: ${{ github.workspace }}/artifacts/models/banking_intent_classifier_model.joblib
        run: |
          python -c "import banking_intent_classifier.models.predict as p; print('Imported from:', p.__file__); print('Model:', p.MODEL_PATH); print('Exists:', p.MODEL_PATH.is_file()); assert p.MODEL_PATH.is_file()"
          python -m pytest tests/ -v

      # Step 6: Check code quality
      - name: Check Python code with Ruff
        run: python -m ruff check src tests

      # Step 7: Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t banking77-api:ci .

      # Step 8: Authenticate with GHCR
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" \
            --password-stdin

      # Step 9: Publish image with commit SHA
      - name: Publish Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          REPOSITORY=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPOSITORY}:${GITHUB_SHA}"

          echo "Publishing image: $IMAGE"

          docker tag banking77-api:ci "$IMAGE"
          docker push "$IMAGE"

          echo "Successfully published: $IMAGE"
  deploy:
    name: Deploy to Axure
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # Step 10: Authenticate to Azure
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      

      # Step 11: Install container Apps commands
      - name: Install Azure Container Apps extenstion
        run: az extension add --name containerapp --upgrade

      # step 12: Deploy our published docker image
      - name: Deploy new image to Azure 
        run: |
          REPOSITORY=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE='ghcr.io/${REPOSITORY}:${GITHUB_SHA}'

          echo "Deploying image: $IMAGE"

          az containerapp update \
            --name banking77-api \
            --resource-group banking77-dev \
            --image "$IMAGE"

      # Step 13: Verify deployed image
      - name: Verify deployed image
        run: |
          REPOSITORY=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          EXPECTED='ghcr.io/${REPOSITORY}:${GITHUB_SHA}'

          ACTTUAL=$(az containerapp show \
            --name banking77-api \
            --resource-group banking77-dev \
            --query properties.template.containers[0].image'\
            -o tsv)

          echo "Expected image: $EXPECTED"
          echo "configured image: $ACTTUAL"

          test "$EXPECTED" = "$ACTTUAL" 

      # step 14: Verify API health
      - name: Verify API health
        run: |
          FQDN=$(az containerapp show \
            --name banking77-api \
            --resource-group rg-banking77-dev \
            --query properties.configuration.ingress.fqdn'\
            -o tsv)

            test -n "$FQDN"

            curl --fail --show-error --silent \
            --retry 6 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 20 \
            "https://${FQDN}/health"